# Pipeline — pil-intelligence
#
# Mart-only compose: legge da GCS HTTPS, produce parquet, li committa nel repo.
# Nessun push GCS — il repo è la source of truth per la dashboard.
#
# Triggers:
#   - schedule: 2° del mese 07:00 UTC (dopo eurostat/DPI che runnano il 1°)
#   - push su main: per aggiornamenti manuali (qualcuno runna locale e pusha)
#   - workflow_dispatch: manuale

name: Pipeline

on:
  schedule:
    - cron: '0 7 2 * *'
  push:
    branches: [main]
    paths:
      - 'sql/**'
      - 'dataset.yml'
  workflow_dispatch:

concurrency:
  group: pil-intelligence-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: Run compose
        run: |
          pwd && ls dataset.yml && toolkit run mart -c "$GITHUB_WORKSPACE/dataset.yml" -y 2026

      - name: Commit parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "Nessuna modifica — skip commit"
          else
            git commit -m "chore: update mart parquet [skip ci]"
            git push
          fi
