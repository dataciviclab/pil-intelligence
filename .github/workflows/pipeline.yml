name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "compose/**"
      - ".github/workflows/pipeline.yml"
  schedule:
    # 2° del mese 07:00 UTC (dopo eurostat e debito-pubblico-intelligence, che runnano il 1°)
    - cron: '0 7 2 * *'
  workflow_dispatch:

concurrency:
  group: pil-intelligence-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "pil-intelligence"
      run-command: "make compose"
      sync-pattern: "per-dataset"
      install-extras: "dev,pipeline"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
