root: "../../out"
schema_version: 1

dataset:
  name: "pil_intelligence"
  source_id: "dataciviclab_composite"
  tags: [economia, pil, gdp, intelligence, nuts3, nace, compose, riconciliazione]
  category: economia
  description: "PIL intelligence: indicatori cross geo x year, GVA per settore, trend, e riconciliazione del PIL tra Eurostat, ISTAT e identità di contabilità nazionale"
  years: [2026]
  time_coverage:
    start_year: 1975
    end_year: 2026

# Mart-only compose: gli SQL leggono direttamente da GCS via support type: external.
# CI: toolkit run mart → sync mart su GCS → registry PR. Dashboard legge da GCS.

support:
  # ── Eurostat clean (NUTS3/NUTS2) ────────────────────────────────────────
  - name: eurostat_gdp_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_gdp_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_gva_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_gva_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_emp_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_emp_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_labour_productivity_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_labour_productivity_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_tourism_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_tourism_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_crime_nuts3
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_crime_nuts3
    prefix: "eurostat/"
    years: [2026]
  - name: eurostat_gfcf_nuts2
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_gfcf_nuts2
    prefix: "eurostat/"
    years: [2026]
  # ── Eurostat clean nazionale (componenti PIL: reddito e spesa) ──────────
  - name: eurostat_nama10_gdp_clean
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: eurostat_nama10_gdp
    prefix: "eurostat/"
    years: [2026]
  # ── ISTAT: conti territoriali (PIL, VA, imposte nette) ──────────────────
  - name: istat_pil_territoriale
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: istat_pil_territoriale
    years: [2024]
  # ── ISTAT: statistiche strutturali imprese (VA, COE, GOS per dimensione) ─
  - name: istat_sbs_imprese
    type: external
    bucket: clean
    pattern: clean_parquet
    slug: istat_sbs_imprese
    years: [2024]
  # ── Eurostat mart (componenti domanda + trimestrale) ────────────────────
  - name: eurostat_nama10_gdp
    type: external
    bucket: mart
    pattern: mart_parquet
    slug: eurostat_nama10_gdp
    prefix: "eurostat/"
    table: mart_expenditure
    years: [2026]
  - name: eurostat_namq10_gdp
    type: external
    bucket: mart
    pattern: mart_parquet
    slug: eurostat_namq10_gdp
    prefix: "eurostat/"
    table: mart_quarterly
    years: [2026]

mart:
  tables:
    - name: "mart_hub"
      sql: "sql/mart_hub.sql"
    - name: "mart_settori"
      sql: "sql/mart_settori.sql"
    - name: "mart_settori_trend"
      sql: "sql/mart_settori_trend.sql"
    - name: "mart_trend_integrato"
      sql: "sql/mart_trend_integrato.sql"
    - name: "mart_domanda"
      sql: "sql/mart_domanda.sql"
    - name: "mart_trimestrale"
      sql: "sql/mart_trimestrale.sql"
    - name: "mart_riconciliazione"
      sql: "sql/mart_riconciliazione.sql"
    - name: "mart_pil_componenti"
      sql: "sql/mart_pil_componenti.sql"
    - name: "mart_imprese_sintesi"
      sql: "sql/mart_imprese_sintesi.sql"
  required_tables:
    - "mart_hub"
    - "mart_settori"
    - "mart_trend_integrato"
    - "mart_domanda"
    - "mart_riconciliazione"
    - "mart_pil_componenti"
    - "mart_imprese_sintesi"
  validate:
    table_rules:
      mart_hub: { min_rows: 500 }
      mart_settori: { min_rows: 5000 }
      mart_settori_trend: { min_rows: 5000 }
      mart_trend_integrato: { min_rows: 100 }
      mart_riconciliazione: { min_rows: 1000 }
      mart_pil_componenti: { min_rows: 25 }
      mart_imprese_sintesi: { min_rows: 500 }

validation:
  fail_on_error: true

output:
  artifacts: "standard"
