[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pil-intelligence"
version = "0.1.0"
description = "PIL Intelligence: dashboard + compose per l'intelligence sul PIL italiano"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[tool.setuptools]
packages = []
