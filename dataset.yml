root: "out"
schema_version: 1

dataset:
  name: "pil_intelligence"
  source_id: "dataciviclab_composite"
  tags: [economia, pil, gdp, intelligence, nuts3, nace, compose]
  category: economia
  description: "PIL intelligence hub: indicatori cross per geo x year, GVA per settore, debito/fisco Italia, trend integrato"
  years: [2026]

# Mart-only compose: SQL legge direttamente da GCS via support type: external.
# CI runna toolkit run mart → committa i parquet nel repo. Dashboard legge dal repo.

support:
  - name: eurostat_gdp_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_gdp_nuts3/eurostat_gdp_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_gva_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_gva_nuts3/eurostat_gva_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_emp_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_emp_nuts3/eurostat_emp_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_labour_productivity_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_labour_productivity_nuts3/eurostat_labour_productivity_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_tourism_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_tourism_nuts3/eurostat_tourism_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_crime_nuts3
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_crime_nuts3/eurostat_crime_nuts3_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_gfcf_nuts2
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_gfcf_nuts2/eurostat_gfcf_nuts2_{year}_clean.parquet"
    years: [2026]
  - name: ocpi_serie_storiche
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/debito_pubblico_intelligence/ocpi_serie_storiche/{year}/ocpi_serie_storiche_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_debito_pil
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/debito_pubblico_intelligence/eurostat_debito_pil/{year}/eurostat_debito_pil_{year}_clean.parquet"
    years: [2026]
  - name: eurostat_nama10_gdp
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-mart/eurostat/eurostat_nama10_gdp/mart_expenditure.parquet"
  - name: eurostat_namq10_gdp
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-mart/eurostat/eurostat_namq10_gdp/mart_quarterly.parquet"

mart:
  tables:
    - name: "mart_hub"
      sql: "sql/mart_hub.sql"
    - name: "mart_settori"
      sql: "sql/mart_settori.sql"
    - name: "mart_debito_fisco"
      sql: "sql/mart_debito_fisco.sql"
    - name: "mart_trend_integrato"
      sql: "sql/mart_trend_integrato.sql"
    - name: "mart_domanda"
      sql: "sql/mart_domanda.sql"
    - name: "mart_trimestrale"
      sql: "sql/mart_trimestrale.sql"
    - name: "mart_settori_trend"
      sql: "sql/mart_settori_trend.sql"
  required_tables:
    - "mart_hub"
    - "mart_settori"
    - "mart_debito_fisco"
    - "mart_trend_integrato"
    - "mart_domanda"
  validate:
    table_rules:
      mart_hub: { min_rows: 500 }
      mart_settori: { min_rows: 5000 }
      mart_debito_fisco: { min_rows: 20 }
      mart_trend_integrato: { min_rows: 100 }
      mart_settori_trend: { min_rows: 5000 }

validation:
  fail_on_error: true
